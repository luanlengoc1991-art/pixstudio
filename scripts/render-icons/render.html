<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Renders one tool icon. Each tool gets its own shape ("variant") so the set
// does not look like one template repeated: tile, disc, hexagon, orb, cube,
// glass cube, stacked layers, tilted card or a floating glyph on a light ring.
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const params = new URLSearchParams(location.search);
const id = params.get("id");
const variant = params.get("variant") || "tile";
const [light, main, deep] = params.get("colors").split(",").map((c) => new THREE.Color("#" + c));
const SIZE = 512;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
camera.position.set(-2.4, 2.2, 8.2);
camera.lookAt(0, -0.25, 0);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(-4, 5, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(light, 5);
rim.position.set(5, 3, -4);
scene.add(rim);
const glowLight = new THREE.PointLight(main, 18, 5);
glowLight.position.set(0, -1.2, 1.6);
scene.add(glowLight);

const group = new THREE.Group();
scene.add(group);

// ---------- materials ----------
const gradientTexture = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 200, 256);
  grad.addColorStop(0, "#" + light.getHexString());
  grad.addColorStop(0.4, "#" + main.getHexString());
  grad.addColorStop(1, "#" + deep.getHexString());
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const glossy = () =>
  new THREE.MeshPhysicalMaterial({
    map: gradientTexture,
    metalness: 0.1,
    roughness: 0.2,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    emissive: deep,
    emissiveIntensity: 0.18,
  });
const glass = () =>
  new THREE.MeshPhysicalMaterial({
    color: light,
    metalness: 0,
    roughness: 0.12,
    transmission: 0.55,
    thickness: 1.2,
    ior: 1.45,
    clearcoat: 1,
    attenuationColor: main,
    attenuationDistance: 5,
    iridescence: 0.4,
    transparent: true,
  });
const chrome = () => new THREE.MeshPhysicalMaterial({ color: light.clone().lerp(new THREE.Color(0xffffff), 0.6), metalness: 1, roughness: 0.15, clearcoat: 1 });
const dark = () => new THREE.MeshPhysicalMaterial({ color: 0x0a0f26, metalness: 0.5, roughness: 0.3, clearcoat: 1 });
const glow = (opacity = 0.95) => new THREE.MeshBasicMaterial({ color: main, transparent: true, opacity });
// Translucent white "overlay" glyph that lets the surface colour show through
const overlayGlyph = () =>
  new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    emissive: new THREE.Color("#ffffff").lerp(light, 0.4),
    emissiveIntensity: 0.75,
    roughness: 0.35,
    transparent: true,
    opacity: 0.82,
    side: THREE.DoubleSide,
  });

// ---------- glyph ----------
const svgText = await (await fetch(`./filled/${id}.svg`)).text();
const shapes = new SVGLoader().parse(svgText).paths.flatMap((p) => SVGLoader.createShapes(p));
/** Extruded glyph centred on the origin, facing +z, `size` units across. */
const glyph = (size, material, depth = 30, bevel = 8) => {
  const geo = new THREE.ExtrudeGeometry(shapes, {
    depth,
    bevelEnabled: true,
    bevelThickness: bevel,
    bevelSize: bevel * 0.4,
    bevelSegments: 4,
    curveSegments: 24,
  });
  geo.computeBoundingBox();
  const b = geo.boundingBox;
  const w = b.max.x - b.min.x;
  const h = b.max.y - b.min.y;
  geo.translate(-(b.min.x + w / 2), -(b.min.y + h / 2), 0);
  const mesh = new THREE.Mesh(geo, material);
  const s = size / Math.max(w, h);
  mesh.scale.set(s, -s, s); // SVG y points down
  return mesh;
};

// ---------- bases ----------
const plateBase = () => {
  const plate = new THREE.Mesh(new RoundedBoxGeometry(3.0, 0.28, 2.1, 8, 0.12), dark());
  plate.position.set(0, -1.32, 0.15);
  const edge = new THREE.Mesh(new RoundedBoxGeometry(3.06, 0.04, 2.16, 8, 0.02), glow());
  edge.position.set(0, -1.47, 0.15);
  group.add(plate, edge);
};
const pedestalBase = () => {
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.45, 0.38, 64), dark());
  ped.position.y = -1.3;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.36, 0.035, 16, 96), glow());
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -1.11;
  group.add(ped, ring);
};
const ringBase = () => {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.06, 64), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
  disc.position.y = -1.35;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.06, 16, 96), glow(1));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -1.3;
  const inner = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.025, 16, 96), glow(0.6));
  inner.rotation.x = Math.PI / 2;
  inner.position.y = -1.3;
  group.add(disc, ring, inner);
};

// ---------- variants ----------
const add = (...objects) => objects.forEach((o) => group.add(o));

if (variant === "tile") {
  plateBase();
  const tile = new THREE.Group();
  tile.add(new THREE.Mesh(new RoundedBoxGeometry(2.1, 2.1, 0.7, 10, 0.3), glossy()));
  const g = glyph(1.0, overlayGlyph());
  g.position.z = 0.345;
  tile.add(g);
  tile.rotation.x = -0.14;
  add(tile);
  group.rotation.y = 0.18;
} else if (variant === "disc") {
  pedestalBase();
  const coin = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.5, 96), glossy());
  body.rotation.x = Math.PI / 2;
  const rimRing = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.07, 24, 96), chrome());
  rimRing.position.z = 0.25;
  const g = glyph(1.0, overlayGlyph());
  g.position.z = 0.25;
  coin.add(body, rimRing, g);
  coin.position.y = 0.05;
  coin.rotation.set(-0.1, 0.35, 0);
  add(coin);
} else if (variant === "coin-ring") {
  ringBase();
  const coin = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 0.36, 96), glossy());
  body.rotation.x = Math.PI / 2;
  const rimRing = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.09, 24, 96), chrome());
  rimRing.position.z = 0.18;
  const g = glyph(1.0, overlayGlyph());
  g.position.z = 0.18;
  coin.add(body, rimRing, g);
  coin.position.y = 0.1;
  coin.rotation.set(-0.08, -0.3, 0);
  add(coin);
} else if (variant === "hex") {
  pedestalBase();
  const hexShape = new THREE.Shape();
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i + Math.PI / 6;
    const x = Math.cos(a) * 1.15;
    const y = Math.sin(a) * 1.15;
    i === 0 ? hexShape.moveTo(x, y) : hexShape.lineTo(x, y);
  }
  hexShape.closePath();
  const geo = new THREE.ExtrudeGeometry(hexShape, { depth: 0.42, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.12, bevelSegments: 6 });
  geo.translate(0, 0, -0.21);
  const hex = new THREE.Group();
  hex.add(new THREE.Mesh(geo, glossy()));
  const g = glyph(0.95, overlayGlyph());
  g.position.z = 0.34;
  hex.add(g);
  hex.position.y = 0.05;
  hex.rotation.set(-0.1, 0.3, 0);
  add(hex);
} else if (variant === "orb") {
  pedestalBase();
  const orb = new THREE.Group();
  orb.add(new THREE.Mesh(new THREE.SphereGeometry(1.15, 96, 64), glossy()));
  const g = glyph(0.78, overlayGlyph(), 60, 10);
  g.position.z = 1.16;
  orb.add(g);
  orb.position.y = 0.05;
  orb.rotation.y = -0.3; // turn the glyph towards the camera (which sits to the left)
  add(orb);
} else if (variant === "cube") {
  plateBase();
  const cube = new THREE.Group();
  cube.add(new THREE.Mesh(new RoundedBoxGeometry(1.75, 1.75, 1.75, 8, 0.22), glossy()));
  const g = glyph(1.0, overlayGlyph());
  g.position.z = 0.875;
  cube.add(g);
  cube.position.y = -0.1;
  cube.rotation.set(0.05, 0.62, 0);
  add(cube);
} else if (variant === "glass-cube") {
  plateBase();
  const cube = new THREE.Group();
  // Frosted, see-through shell (no refraction, so the glyph inside stays crisp)
  const shell = new THREE.Mesh(
    new RoundedBoxGeometry(1.9, 1.9, 1.9, 8, 0.25),
    new THREE.MeshPhysicalMaterial({ color: light, transparent: true, opacity: 0.32, roughness: 0.05, clearcoat: 1, depthWrite: false, emissive: main, emissiveIntensity: 0.15 }),
  );
  shell.renderOrder = 2;
  cube.add(shell);
  // A glowing glyph floating inside the glass
  const g = glyph(1.2, new THREE.MeshPhysicalMaterial({ map: gradientTexture, emissive: main, emissiveIntensity: 0.9, roughness: 0.3, side: THREE.DoubleSide }), 50, 8);
  g.position.z = 0.2;
  cube.add(g);
  cube.position.y = -0.05;
  cube.rotation.set(0.04, 0.5, 0);
  add(cube);
} else if (variant === "stack") {
  plateBase();
  const stack = new THREE.Group();
  for (let i = 2; i >= 0; i--) {
    const layer = new THREE.Mesh(
      new RoundedBoxGeometry(1.9, 1.9, 0.2, 8, 0.09),
      i === 0
        ? glossy()
        : new THREE.MeshPhysicalMaterial({ color: light, transparent: true, opacity: 0.45 - i * 0.1, roughness: 0.1, clearcoat: 1, emissive: main, emissiveIntensity: 0.3 }),
    );
    layer.position.set(i * 0.32, i * 0.3, -i * 0.42);
    stack.add(layer);
  }
  const g = glyph(0.95, overlayGlyph());
  g.position.z = 0.11;
  stack.add(g);
  stack.position.set(-0.25, -0.1, 0.2);
  stack.rotation.set(-0.12, 0.3, 0);
  add(stack);
} else if (variant === "tilted") {
  pedestalBase();
  const card = new THREE.Group();
  card.add(new THREE.Mesh(new RoundedBoxGeometry(2.1, 2.1, 0.32, 10, 0.15), glossy()));
  const g = glyph(1.0, overlayGlyph());
  g.position.z = 0.16;
  card.add(g);
  card.position.set(0, 0.0, 0.1);
  card.rotation.set(-0.5, 0.35, 0);
  add(card);
} else if (variant === "float") {
  ringBase();
  // The glyph itself is the object: thick, glossy and coloured
  const g = glyph(1.9, glossy(), 120, 20);
  g.position.y = 0.05;
  g.rotation.y = 0.28;
  add(g);
}

renderer.render(scene, camera);
const dataUrl = renderer.domElement.toDataURL("image/png");
const fs = window.require("fs");
fs.writeFileSync(`${params.get("out")}/${id}.png`, Buffer.from(dataUrl.split(",")[1], "base64"));
document.title = "done";
</script>
</body>
</html>
