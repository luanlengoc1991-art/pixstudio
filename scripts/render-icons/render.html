<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const params = new URLSearchParams(location.search);
const id = params.get("id");
const [light, main, deep] = params.get("colors").split(",").map((c) => new THREE.Color("#" + c));
const SIZE = 512;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// View from the front-left, slightly above, like the mockup's icon shelf
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
camera.position.set(-2.4, 2.2, 8.2);
camera.lookAt(0, -0.25, 0);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(-4, 5, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(light, 5);
rim.position.set(5, 3, -4);
scene.add(rim);
const glowLight = new THREE.PointLight(main, 18, 5);
glowLight.position.set(0, -1.2, 1.6);
scene.add(glowLight);

const group = new THREE.Group();
scene.add(group);

const gradientTexture = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 200, 256);
  grad.addColorStop(0, "#" + light.getHexString());
  grad.addColorStop(0.4, "#" + main.getHexString());
  grad.addColorStop(1, "#" + deep.getHexString());
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

// Dark base plate lying flat, with a thin glowing rim
const base = new THREE.Mesh(
  new RoundedBoxGeometry(3.0, 0.28, 2.1, 8, 0.12),
  new THREE.MeshPhysicalMaterial({ color: 0x0a0f26, metalness: 0.5, roughness: 0.3, clearcoat: 1 }),
);
base.position.set(0, -1.32, 0.15);
group.add(base);
const rimGlow = new THREE.Mesh(
  new RoundedBoxGeometry(3.06, 0.04, 2.16, 8, 0.02),
  new THREE.MeshBasicMaterial({ color: main, transparent: true, opacity: 0.95 }),
);
rimGlow.position.set(0, -1.47, 0.15); // just under the plate: only its edge glows
group.add(rimGlow);

// Thick upright coloured tile, tilted back a little
const tile = new THREE.Group();
const block = new THREE.Mesh(
  new RoundedBoxGeometry(2.1, 2.1, 0.7, 10, 0.3),
  new THREE.MeshPhysicalMaterial({
    map: gradientTexture,
    metalness: 0.1,
    roughness: 0.22,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    emissive: deep,
    emissiveIntensity: 0.18,
  }),
);
tile.add(block);

const svgText = await (await fetch(`./filled/${id}.svg`)).text();
const data = new SVGLoader().parse(svgText);
const shapes = data.paths.flatMap((p) => SVGLoader.createShapes(p));
const iconGeo = new THREE.ExtrudeGeometry(shapes, {
  depth: 30,
  bevelEnabled: true,
  bevelThickness: 8,
  bevelSize: 3,
  bevelSegments: 3,
  curveSegments: 24,
});
iconGeo.computeBoundingBox();
const bb = iconGeo.boundingBox;
const w = bb.max.x - bb.min.x;
const h = bb.max.y - bb.min.y;
iconGeo.translate(-(bb.min.x + w / 2), -(bb.min.y + h / 2), 0);
const icon = new THREE.Mesh(
  iconGeo,
  // Overlay look: translucent white over the tile so its colour shows through, with a soft glow
  new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    emissive: new THREE.Color("#ffffff").lerp(light, 0.4),
    emissiveIntensity: 0.75,
    metalness: 0.0,
    roughness: 0.35,
    transparent: true,
    opacity: 0.82,
    side: THREE.DoubleSide,
  }),
);
const s = 0.98 / Math.max(w, h);
icon.scale.set(s, -s, s); // SVG y points down
icon.position.z = 0.345;
tile.add(icon);

tile.position.y = 0.0;
tile.rotation.x = -0.14;
group.add(tile);
group.rotation.y = 0.18;

renderer.render(scene, camera);
const dataUrl = renderer.domElement.toDataURL("image/png");
const fs = window.require("fs");
fs.writeFileSync(`${params.get("out")}/${id}.png`, Buffer.from(dataUrl.split(",")[1], "base64"));
document.title = "done";
</script>
</body>
</html>
