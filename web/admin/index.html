<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LMS Studio · Quản trị</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#2a313c;--text:#e6edf3;--muted:#8b949e;--accent:#7c5cff;--ok:#2ea043;--bad:#f85149;--warn:#d29922}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header img{width:32px;height:32px}
header b{font-size:16px}
header .sp{flex:1}
main{max-width:1200px;margin:0 auto;padding:16px}
button,input,select{font:inherit;color:inherit}
button{background:#21262d;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#8b949e}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px}
input,select{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.login{max-width:360px;margin:12vh auto}
.login h1{margin:0 0 16px;font-size:20px;text-align:center}
.login input{width:100%;margin-bottom:10px}
.login button{width:100%}
.err{color:var(--bad);min-height:20px;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
td.key{font-family:ui-monospace,Consolas,monospace}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.muted{color:var(--muted)}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.newkeys{font-family:ui-monospace,Consolas,monospace;white-space:pre;background:#0d1117;border:1px dashed var(--accent);border-radius:8px;padding:10px;margin-top:10px;user-select:all}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;min-width:320px;max-width:90vw}
dialog::backdrop{background:#0008}
.toast{position:fixed;bottom:16px;right:16px;background:#21262d;border:1px solid var(--line);border-radius:8px;padding:10px 14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.search{flex:1;min-width:180px}
@media (max-width:640px){main{padding:10px}.card{padding:12px}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="dlg.close()">Đóng</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
const API = "/api";
let token = localStorage.getItem("lms.admin.token") || "";
let tab = "users";
let data = { stats: {}, users: [], keys: [] };
let filter = "";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (t) => (t ? new Date(t).toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" }) : "—");
const day = (t) => (t ? new Date(t).toLocaleDateString("vi-VN") : "—");
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2500); }

async function api(path, method = "GET", body) {
  const r = await fetch(API + path, {
    method,
    headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) { token = ""; localStorage.removeItem("lms.admin.token"); render(); }
    throw new Error(j.error?.message || "Lỗi " + r.status);
  }
  return j;
}
async function act(fn, ok) { try { await fn(); if (ok) toast(ok); await load(); } catch (e) { toast("⚠ " + e.message); } }

function expiry(exp, now = Date.now()) {
  if (exp === null || exp === undefined) return '<span class="pill ok">Vĩnh viễn</span>';
  if (exp >= 9e15) return '<span class="pill ok">Vĩnh viễn</span>';
  const days = Math.ceil((exp - now) / 86400000);
  if (days <= 0) return '<span class="pill bad">Hết hạn ' + day(exp) + "</span>";
  return '<span class="pill ' + (days <= 7 ? "warn" : "ok") + '">' + day(exp) + " · còn " + days + " ngày</span>";
}

function render() {
  const app = $("#app");
  if (!token) {
    app.innerHTML = `<div class="card login"><h1>LMS Studio · Quản trị</h1>
      <form id="lf"><input name="u" placeholder="Tên đăng nhập" autocomplete="username" required>
      <input name="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button class="primary">Đăng nhập</button><div class="err" id="lerr"></div></form></div>`;
    $("#lf").onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      try {
        let id = localStorage.getItem("lms.admin.device");
        if (!id) { id = crypto.randomUUID(); localStorage.setItem("lms.admin.device", id); }
        const r = await api("/auth/login", "POST", { username: f.u.value, password: f.p.value, deviceId: id, deviceName: "Trang quản trị" });
        if (r.user.role !== "admin") { await fetch(API + "/auth/logout", { method: "POST", headers: { authorization: "Bearer " + r.token } }); throw new Error("Tài khoản này không phải quản trị viên"); }
        token = r.token; localStorage.setItem("lms.admin.token", token);
        render(); load();
      } catch (err) { $("#lerr").textContent = err.message; }
    };
    return;
  }
  const s = data.stats;
  app.innerHTML = `<header><img src="/logo-lms.png" alt=""><b>LMS Studio · Quản trị</b><span class="sp"></span>
      <button onclick="changePw()">Đổi mật khẩu</button><button onclick="logout()">Đăng xuất</button></header>
    <main>
      <div class="stats">
        <div class="stat"><b>${s.users ?? "…"}</b><span>Tài khoản</span></div>
        <div class="stat"><b>${s.liveKeys ?? "…"}</b><span>Key đang dùng</span></div>
        <div class="stat"><b>${s.unusedKeys ?? "…"}</b><span>Key chưa dùng</span></div>
        <div class="stat"><b>${s.devices ?? "…"}</b><span>Máy đã kích hoạt</span></div>
        <div class="stat"><b>${s.activeToday ?? "…"}</b><span>Máy mở app 24h qua</span></div>
      </div>
      <div class="tabs"><button class="${tab === "users" ? "on" : ""}" onclick="setTab('users')">Tài khoản</button>
        <button class="${tab === "keys" ? "on" : ""}" onclick="setTab('keys')">Key bản quyền</button></div>
      <div id="pane"></div>
    </main>`;
  tab === "users" ? renderUsers() : renderKeys();
}
function setTab(t) { tab = t; filter = ""; render(); }

function renderUsers() {
  const f = filter.toLowerCase();
  const rows = data.users.filter((u) => !f || [u.username, u.display_name, u.note].join(" ").toLowerCase().includes(f));
  $("#pane").innerHTML = `<div class="card"><b>Tạo tài khoản</b>
    <form id="uf" class="row" style="margin-top:10px">
      <label>Tên đăng nhập<input name="username" required pattern="[A-Za-z0-9._@\\-]{3,64}"></label>
      <label>Mật khẩu<input name="password" required minlength="6"></label>
      <label>Tên hiển thị<input name="displayName"></label>
      <label>Ghi chú<input name="note"></label>
      <label>Vai trò<select name="role"><option value="user">Người dùng</option><option value="admin">Quản trị</option></select></label>
      <label>Cấp key kèm<select name="withKey"><option value="1">Có</option><option value="">Không</option></select></label>
      <label>Số ngày (0 = vĩnh viễn)<input name="days" type="number" value="30" min="0" style="width:120px"></label>
      <label>Số máy<input name="maxDevices" type="number" value="1" min="1" max="100" style="width:80px"></label>
      <button class="primary">Tạo</button>
    </form><div id="ures"></div></div>
    <div class="card"><div class="row" style="margin-bottom:8px"><input class="search" placeholder="Tìm tài khoản…" value="${esc(filter)}" oninput="filter=this.value;renderUsers();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>
    <div class="tbl"><table><tr><th>Tài khoản</th><th>Vai trò</th><th>Hạn dùng</th><th>Key</th><th>Máy</th><th>Đăng nhập gần nhất</th><th>Trạng thái</th><th></th></tr>
    ${rows.map((u) => `<tr><td><b>${esc(u.username)}</b><br><span class="muted">${esc(u.display_name)} ${u.note ? "· " + esc(u.note) : ""}</span></td>
      <td>${u.role === "admin" ? '<span class="pill warn">Quản trị</span>' : "Người dùng"}</td>
      <td>${u.role === "admin" ? "—" : u.expires_at === null ? '<span class="pill bad">Chưa có key</span>' : expiry(u.expires_at)}</td>
      <td>${u.key_count}</td><td>${u.devices}</td><td>${fmt(u.last_login_at)}</td>
      <td>${u.disabled ? '<span class="pill bad">Đã khoá</span>' : '<span class="pill ok">Hoạt động</span>'}</td>
      <td class="acts">${u.role === "admin" ? "" : `<button class="sm" onclick="giveKey('${esc(u.username)}')">+ Key</button>`}
        <button class="sm" onclick="showUserKeys('${esc(u.username)}')">Xem key</button>
        <button class="sm" onclick="resetPw(${u.id},'${esc(u.username)}')">Đặt lại MK</button>
        <button class="sm" onclick="toggleUser(${u.id},${u.disabled ? 0 : 1})">${u.disabled ? "Mở khoá" : "Khoá"}</button>
        <button class="sm danger" onclick="delUser(${u.id},'${esc(u.username)}')">Xoá</button></td></tr>`).join("")}
    </table></div>${rows.length ? "" : '<p class="muted">Chưa có tài khoản.</p>'}</div>`;
  $("#uf").onsubmit = (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    act(async () => {
      const r = await api("/admin/users", "POST", { ...f, withKey: !!f.withKey, days: +f.days, maxDevices: +f.maxDevices });
      const info = `Tài khoản: ${r.username}\nMật khẩu: ${f.password}` + (r.keys.length ? `\nKey: ${r.keys[0]}` : "");
      data.lastUser = info;
      setTimeout(() => { const el = $("#ures"); if (el) el.innerHTML = `<div class="newkeys">${esc(info)}</div><button class="sm" style="margin-top:6px" onclick="copy(data.lastUser)">Chép thông tin</button>`; }, 50);
    }, "Đã tạo tài khoản");
  };
}

function renderKeys() {
  const f = filter.toLowerCase();
  const rows = data.keys.filter((k) => !f || [k.key, k.username, k.note].join(" ").toLowerCase().includes(f));
  $("#pane").innerHTML = `<div class="card"><b>Tạo key</b>
    <form id="kf" class="row" style="margin-top:10px">
      <label>Số lượng<input name="count" type="number" value="1" min="1" max="100" style="width:90px"></label>
      <label>Số ngày (0 = vĩnh viễn)<input name="days" type="number" value="30" min="0" style="width:120px"></label>
      <label>Số máy<input name="maxDevices" type="number" value="1" min="1" max="100" style="width:80px"></label>
      <label>Gán cho tài khoản (tuỳ chọn)<input name="username"></label>
      <label>Ghi chú<input name="note"></label>
      <button class="primary">Tạo key</button>
    </form><div id="kres"></div>
    <p class="muted" style="margin:8px 0 0">Key chưa gán: hạn tính từ lúc người dùng nhập key lần đầu. Key gán cho tài khoản: hạn tính từ bây giờ.</p></div>
    <div class="card"><div class="row" style="margin-bottom:8px"><input class="search" placeholder="Tìm key, tài khoản, ghi chú…" value="${esc(filter)}" oninput="filter=this.value;renderKeys();this.focus();this.setSelectionRange(this.value.length,this.value.length)"></div>
    <div class="tbl"><table><tr><th>Key</th><th>Tài khoản</th><th>Hạn</th><th>Máy</th><th>Trạng thái</th><th>Ghi chú</th><th>Tạo lúc</th><th></th></tr>
    ${rows.map((k) => `<tr><td class="key">${esc(k.key)} <button class="sm" onclick="copy('${k.key}')">Chép</button></td>
      <td>${k.username ? esc(k.username) : '<span class="muted">Chưa dùng</span>'}</td>
      <td>${k.user_id === null ? (k.duration_days ? k.duration_days + " ngày (chưa kích hoạt)" : "Vĩnh viễn (chưa kích hoạt)") : expiry(k.expires_at, data.now)}</td>
      <td><a href="#" onclick="showDevices('${k.key}');return false">${k.devices}/${k.max_devices}</a></td>
      <td>${k.status === "active" ? '<span class="pill ok">Hiệu lực</span>' : '<span class="pill bad">Thu hồi</span>'}</td>
      <td>${esc(k.note)}</td><td>${day(k.created_at)}</td>
      <td class="acts"><button class="sm" onclick="extend('${k.key}')">Gia hạn</button>
        <button class="sm" onclick="setMax('${k.key}',${k.max_devices})">Số máy</button>
        <button class="sm" onclick="showDevices('${k.key}')">Máy</button>
        ${k.status === "active" ? `<button class="sm" onclick="setStatus('${k.key}','revoked')">Thu hồi</button>` : `<button class="sm" onclick="setStatus('${k.key}','active')">Khôi phục</button>`}
        ${k.user_id !== null ? `<button class="sm" onclick="unassign('${k.key}')">Gỡ tài khoản</button>` : ""}
        <button class="sm danger" onclick="delKey('${k.key}')">Xoá</button></td></tr>`).join("")}
    </table></div>${rows.length ? "" : '<p class="muted">Chưa có key.</p>'}</div>`;
  $("#kf").onsubmit = (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    act(async () => {
      const r = await api("/admin/keys", "POST", { ...f, count: +f.count, days: +f.days, maxDevices: +f.maxDevices });
      data.lastKeys = r.keys.join("\n");
      setTimeout(() => { const el = $("#kres"); if (el) el.innerHTML = `<div class="newkeys">${esc(data.lastKeys)}</div><button class="sm" style="margin-top:6px" onclick="copy(data.lastKeys)">Chép tất cả</button>`; }, 50);
    }, "Đã tạo key");
  };
}

function copy(t) { navigator.clipboard.writeText(t).then(() => toast("Đã chép")); }
function giveKey(username) {
  const days = prompt("Số ngày cho key mới của " + username + " (0 = vĩnh viễn):", "30"); if (days === null) return;
  const max = prompt("Số máy được dùng:", "1"); if (max === null) return;
  act(async () => { const r = await api("/admin/keys", "POST", { username, days: +days, maxDevices: +max }); prompt("Key mới (đã kích hoạt cho " + username + "):", r.keys[0]); }, "Đã cấp key");
}
function showUserKeys(username) { tab = "keys"; filter = username; render(); }
function resetPw(id, u) { const p = prompt("Mật khẩu mới cho " + u + " (≥ 6 ký tự):"); if (p) act(() => api("/admin/users/" + id, "PATCH", { password: p }), "Đã đổi mật khẩu, các máy phải đăng nhập lại"); }
function toggleUser(id, disabled) { act(() => api("/admin/users/" + id, "PATCH", { disabled: !!disabled }), disabled ? "Đã khoá" : "Đã mở khoá"); }
function delUser(id, u) { if (confirm("Xoá tài khoản " + u + "? Key của tài khoản sẽ bị thu hồi.")) act(() => api("/admin/users/" + id, "DELETE"), "Đã xoá"); }
function extend(key) {
  const d = prompt("Cộng thêm bao nhiêu ngày? (số âm để bớt, gõ 'vv' = vĩnh viễn)", "30"); if (d === null) return;
  act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", d.trim().toLowerCase() === "vv" ? { forever: true } : { addDays: +d }), "Đã gia hạn");
}
function setMax(key, cur) { const n = prompt("Số máy tối đa:", cur); if (n) act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { maxDevices: +n }), "Đã đổi số máy"); }
function setStatus(key, status) { if (status === "active" || confirm("Thu hồi key " + key + "? Người dùng sẽ bị khoá app.")) act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { status }), "Đã cập nhật"); }
function unassign(key) { if (confirm("Gỡ key khỏi tài khoản và xoá danh sách máy? Key sẽ thành chưa dùng.")) act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { unassign: true }), "Đã gỡ"); }
function delKey(key) { if (confirm("Xoá hẳn key " + key + "?")) act(() => api("/admin/keys/" + encodeURIComponent(key), "DELETE"), "Đã xoá key"); }
async function showDevices(key) {
  try {
    const r = await api("/admin/keys/" + encodeURIComponent(key) + "/devices");
    $("#dlgBody").innerHTML = `<b>Máy của key ${esc(key)}</b>` + (r.devices.length ? `<table style="margin-top:10px"><tr><th>Tên máy</th><th>Lần đầu</th><th>Gần nhất</th><th></th></tr>
      ${r.devices.map((d) => `<tr><td>${esc(d.device_name)}</td><td>${fmt(d.first_seen)}</td><td>${fmt(d.last_seen)}</td>
        <td><button class="sm danger" onclick="removeDevice(${d.id},'${key}')">Gỡ máy</button></td></tr>`).join("")}</table>` : '<p class="muted">Chưa có máy nào.</p>');
    dlg.showModal();
  } catch (e) { toast("⚠ " + e.message); }
}
async function removeDevice(id, key) { if (!confirm("Gỡ máy này? Máy đó sẽ bị đăng xuất.")) return; await act(() => api("/admin/devices/" + id, "DELETE"), "Đã gỡ máy"); showDevices(key); }
function changePw() {
  const o = prompt("Mật khẩu hiện tại:"); if (!o) return;
  const n = prompt("Mật khẩu mới (≥ 6 ký tự):"); if (!n) return;
  act(() => api("/auth/password", "POST", { oldPassword: o, newPassword: n }), "Đã đổi mật khẩu");
}
async function logout() { try { await api("/auth/logout", "POST"); } catch {} token = ""; localStorage.removeItem("lms.admin.token"); render(); }

async function load() {
  if (!token) return;
  try {
    const [stats, users, keys] = await Promise.all([api("/admin/stats"), api("/admin/users"), api("/admin/keys")]);
    data.stats = stats; data.users = users.users; data.keys = keys.keys; data.now = keys.now;
    const keep = { lastUser: $("#ures")?.innerHTML, lastKeys: $("#kres")?.innerHTML };
    render();
    if (keep.lastUser && $("#ures")) $("#ures").innerHTML = keep.lastUser;
    if (keep.lastKeys && $("#kres")) $("#kres").innerHTML = keep.lastKeys;
  } catch (e) { toast("⚠ " + e.message); }
}
render(); load();
</script>
</body>
</html>
