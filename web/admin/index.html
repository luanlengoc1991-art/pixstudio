// ---- actions & modals ----
async function openUserDetail(id) {
  try {
    const d = await api("/admin/users/" + id);
    const u = d.user;
    const now = d.now || serverNow();
    const mng = canManage(u);
    const p = perms();
    const maxSec = Math.max(60, ...(d.daily || []).map((x) => x.active_seconds || 0));
    const dailyHtml = d.daily?.length
      ? `<div class="bars">${d.daily.map((r) => `<div class="bar-row"><span class="mono muted">${esc(r.day)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, Math.round(((r.active_seconds || 0) / maxSec) * 100))}%"></div></div><span style="text-align:right;font-variant-numeric:tabular-nums"><b>${fmtDur(r.active_seconds)}</b> · ${r.sessions_count || 0}p</span></div>`).join("")}</div>`
      : `<div class="muted" style="font-size:12.5px">Chưa có dữ liệu sử dụng theo ngày.</div>`;

    const keysHtml = d.keys?.length
      ? `<div class="devs">${d.keys.map((k) => `<div class="dev"><div class="ico">${I("key")}</div><div class="info"><b class="mono">${esc(k.key)}</b><small>Tạo ${day(k.created_at)} · ${k.activated_at ? "KH " + day(k.activated_at) : "Chưa kích hoạt"} · ${k.devices}/${k.max_devices} máy${k.note ? " · " + esc(k.note) : ""}</small></div>${k.status !== "active" ? '<span class="pill bad">Thu hồi</span>' : k.activated_at === null && k.expires_at === null && k.duration_days > 0 ? `<span class="pill info">Chờ ĐN · ${k.duration_days}n</span>` : fmtCountdown(k.expires_at, now)}</div>`).join("")}</div>`
      : `<div class="muted" style="font-size:12.5px">Chưa có key nào gắn với tài khoản này.</div>`;

    const sessHtml = d.sessions?.length
      ? `<div class="devs">${d.sessions.map((s) => `<div class="dev"><div class="ico" style="${s.is_online ? "background:var(--ok-bg);color:var(--ok)" : ""}">${I("monitor")}</div><div class="info"><b>${esc(s.device_name || "Không rõ")} ${s.is_online ? '<span class="pill ok" style="margin-left:4px">Online</span>' : ""}${s.is_current ? ' <span class="pill gold">Phiên hiện tại</span>' : ""}</b><small>${esc(s.platform || "—")}${s.app_version ? " v" + esc(s.app_version) : ""} · IP ${esc(s.ip || "—")} · Vào ${fmt(s.created_at)} · Dùng ${fmtDur(s.active_seconds)}${s.current_tool ? " · " + esc(TOOL_NAMES[s.current_tool] || s.current_tool) : ""}</small></div>${!s.is_current && p.manageSessions && (mng || u.id === me?.id) ? `<button type="button" class="btn xs danger" data-d-kick="${s.id}">Đá phiên</button>` : ""}</div>`).join("")}</div>`
      : `<div class="muted" style="font-size:12.5px">Không có phiên nào đang đăng nhập.</div>`;

    const logsHtml = d.logs?.length
      ? `<div class="devs">${d.logs.slice(0, 15).map((l) => `<div class="dev" style="padding:8px 10px"><div class="info"><b style="font-size:12.5px">${esc(l.summary)}</b><small>${fmtSec(l.created_at)} · ${esc(l.actor_username || "Hệ thống")}${l.ip ? " · IP " + esc(l.ip) : ""}</small></div>${logBadge(l.action)}</div>`).join("")}</div>`
      : `<div class="muted" style="font-size:12.5px">Chưa có nhật ký hoạt động.</div>`;

    const body = `
      <div class="dgrid">
        <div class="dbox"><span>Vai trò & Trạng thái</span><b>${esc(ROLE_INFO[u.role]?.label || u.role)}</b><small>${u.disabled ? "Đang bị khoá" : "Đang hoạt động"}${d.failure ? ` · ${d.failure.count} lần sai MK` : ""}</small></div>
        <div class="dbox"><span>Tổng thời gian dùng</span><b>${fmtDur(u.total_active_seconds)}</b><small>${u.login_count || 0} lượt đăng nhập</small></div>
        <div class="dbox"><span>Ngày tạo & Đăng nhập cuối</span><b>${day(u.created_at)}</b><small>ĐN cuối: ${fmt(u.last_login_at)}</small></div>
        <div class="dbox"><span>Hoạt động gần nhất</span><b>${ago(u.last_active_at, "Chưa có")}</b><small>${esc(u.last_device || "—")}${u.last_ip ? " · " + esc(u.last_ip) : ""}</small></div>
      </div>
      ${u.note ? `<div class="hint" style="margin:0">${I("info", "sm")}<span>Ghi chú: <b>${esc(u.note)}</b></span></div>` : ""}
      <div class="dsec"><h4>Biểu đồ sử dụng 14 ngày gần nhất</h4>${dailyHtml}</div>
      <div class="dsec"><h4>Key bản quyền (${d.keys.length})</h4>${keysHtml}</div>
      <div class="dsec"><h4>Phiên đang hoạt động (${d.sessions.length})${d.sessions.length && p.manageSessions && (mng || u.id === me?.id) ? `<button type="button" class="btn xs danger" id="d-kick-all">Đăng xuất tất cả phiên</button>` : ""}</h4>${sessHtml}</div>
      <div class="dsec"><h4>Nhật ký gần đây (${d.logs.length})</h4>${logsHtml}</div>`;

    await modal({
      icon: "user",
      title: `Hồ sơ 360° · ${u.username}`,
      text: `${esc(u.display_name || "Chưa đặt tên hiển thị")} · ID #${u.id}`,
      size: "xl",
      body,
      ok: "",
      cancel: "Đóng",
      onOpen: (el, finish) => {
        el.querySelectorAll("[data-d-kick]").forEach((b) => (b.onclick = async () => {
          finish(null);
          await act(() => api("/admin/sessions/" + b.dataset.dKick, "DELETE"), "Đã đăng xuất phiên");
          openUserDetail(id);
        }));
        const allBtn = el.querySelector("#d-kick-all");
        if (allBtn) allBtn.onclick = async () => {
          finish(null);
          if (await confirmBox(`Đăng xuất toàn bộ phiên của ${u.username}?`, "Mọi thiết bị của tài khoản này sẽ phải đăng nhập lại.", "Đăng xuất tất cả")) {
            await act(() => api(`/admin/users/${id}/logout-all`, "POST"), "Đã đăng xuất toàn bộ phiên");
          }
          openUserDetail(id);
        };
      },
    });
  } catch (e) { toast(e.message, "bad"); }
}

async function editUser(id) {
  const u = state.users.find((x) => x.id === Number(id));
  if (!u) return;
  const p = perms();
  const isSelf = me && u.id === me.id;
  const canEditRole = p.changeRole && (me.role === "super_admin" || (!isSelf && canManage(u)));
  const roleChoices = (me.role === "super_admin" ? ["user", "staff", "admin", "super_admin"] : p.creatableRoles || ["user"]).map((r) => [r, ROLE_INFO[r].label]);
  const fields = [
    { name: "displayName", label: "Tên hiển thị", value: u.display_name || "", placeholder: "vd: Anh Nam" },
    { name: "note", label: "Ghi chú", value: u.note || "", placeholder: "vd: Gói 1 năm, VIP" },
  ];
  if (canEditRole) {
    fields.push({ name: "role", label: "Vai trò phân quyền", value: u.role, options: roleChoices, hint: "Thay đổi vai trò có hiệu lực ngay lập tức trên máy chủ." });
  }
  const v = await modal({ icon: "edit", title: `Chỉnh sửa · ${u.username}`, text: `Tài khoản #${u.id}`, ok: "Lưu thay đổi", fields });
  if (!v) return;
  const payload = { displayName: v.displayName, note: v.note };
  if (canEditRole && v.role) payload.role = v.role;
  act(() => api("/admin/users/" + id, "PATCH", payload), "Đã cập nhật tài khoản");
}

async function giveKey(username) {
  const v = await modal({
    icon: "key", title: "Cấp key cho " + username, text: "Chọn thời lượng, số máy và thời điểm bắt đầu tính hạn.", ok: "Cấp key",
    fields: [
      { name: "days", label: "Số ngày", type: "number", value: 30, min: 0, max: 36500, quick: [[7, "7 ngày"], [30, "30 ngày"], [90, "3 tháng"], [365, "1 năm"], [0, "Vĩnh viễn"]] },
      { name: "maxDevices", label: "Số máy tối đa", type: "number", value: 1, min: 1, max: 100, quick: [[1, "1 máy"], [2, "2 máy"], [3, "3 máy"], [5, "5 máy"]] },
      { name: "activateMode", label: "Bắt đầu tính hạn", value: "first_login", options: [["first_login", "Từ lần đăng nhập đầu"], ["immediate", "Ngay bây giờ"]] },
      { name: "note", label: "Ghi chú", value: "", placeholder: "Tuỳ chọn" },
    ],
  });
  if (!v) return;
  act(async () => {
    const r = await api("/admin/keys", "POST", { username, days: +v.days, maxDevices: +v.maxDevices, activateMode: v.activateMode, note: v.note });
    setTimeout(() => showText("Key mới của " + username, r.keys[0], v.activateMode === "first_login" && +v.days > 0 ? "Key đã gắn, bắt đầu đếm ngược từ lần khách đăng nhập đầu tiên." : "Key đã kích hoạt ngay cho tài khoản."), 40);
  }, "Đã cấp key");
}

async function assignKey(key) {
  const userOpts = state.users.filter((u) => u.role === "user").map((u) => [u.username, `${u.username}${u.display_name ? " (" + u.display_name + ")" : ""}`]);
  if (!userOpts.length) { toast("Chưa có tài khoản người dùng nào để gán", "bad"); return; }
  const v = await modal({
    icon: "link", title: "Gán key cho tài khoản", text: `<code>${esc(key)}</code>`, ok: "Gán key",
    fields: [
      { name: "username", label: "Chọn tài khoản", options: userOpts, value: userOpts[0][0] },
      { name: "activateMode", label: "Bắt đầu tính hạn", value: "first_login", options: [["first_login", "Từ lần đăng nhập đầu"], ["immediate", "Ngay bây giờ"]] },
    ],
  });
  if (!v) return;
  act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { assignUsername: v.username, activateMode: v.activateMode }), "Đã gán key cho " + v.username);
}

async function extendKey(key) {
  const k = state.keys.find((x) => x.key === key);
  const curDate = k?.expires_at ? new Date(k.expires_at).toISOString().slice(0, 10) : new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
  const v = await modal({
    icon: "clock", title: "Gia hạn / Đặt hạn key", text: `<code>${esc(key)}</code>`, ok: "Cập nhật hạn",
    fields: [
      { name: "mode", label: "Chế độ chỉnh hạn", value: "add", options: [["add", "Cộng / bớt số ngày"], ["set", "Đặt còn chính xác N ngày kể từ hôm nay"], ["date", "Chọn ngày hết hạn cụ thể"], ["forever", "Chuyển thành vĩnh viễn"]] },
      { name: "d", label: "Số ngày", type: "number", value: 30, min: -36500, max: 36500, quick: [[7, "+7 ngày"], [30, "+30 ngày"], [90, "+3 tháng"], [365, "+1 năm"], [-7, "-7 ngày"]] },
      { name: "date", label: "Ngày hết hạn (khi chọn chế độ đặt ngày)", type: "date", value: curDate },
    ],
  });
  if (!v) return;
  let body;
  if (v.mode === "forever") body = { forever: true };
  else if (v.mode === "set") body = { setDays: Math.max(0, +v.d) };
  else if (v.mode === "date") {
    const ts = new Date(v.date + "T23:59:59+07:00").getTime();
    if (!Number.isFinite(ts)) { toast("Ngày hết hạn không hợp lệ", "bad"); return; }
    body = { expiresAt: ts };
  } else body = { addDays: +v.d };
  act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", body), "Đã cập nhật hạn sử dụng");
}

async function editKeyNote(key) {
  const k = state.keys.find((x) => x.key === key);
  const v = await modal({ icon: "edit", title: "Sửa ghi chú key", text: `<code>${esc(key)}</code>`, ok: "Lưu", fields: [{ name: "note", label: "Ghi chú", value: k?.note || "", placeholder: "Nhập ghi chú mới" }] });
  if (v) act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { note: v.note }), "Đã cập nhật ghi chú");
}

async function showKeyDevices(key) {
  try {
    const k = state.keys.find((x) => x.key === key) || { max_devices: 1 };
    const r = await api("/admin/keys/" + encodeURIComponent(key) + "/devices");
    const p = perms();
    const list = r.devices.length
      ? `<div class="devs">${r.devices.map((d) => `<div class="dev"><div class="ico">${I("monitor")}</div><div class="info"><b>${esc(d.device_name || "Không rõ")}</b><small>${esc(d.platform || "—")}${d.app_version ? " v" + esc(d.app_version) : ""} · IP ${esc(d.last_ip || "—")} · Dùng ${fmtDur(d.total_active_seconds)} · Gần nhất ${ago(d.last_seen)}</small></div>${p.manageDevices ? `<button type="button" class="btn xs danger" data-rm="${d.id}">Gỡ máy</button>` : ""}</div>`).join("")}</div>`
      : `<div class="empty" style="padding:18px"><div class="ico">${I("monitor")}</div>Chưa có máy nào kích hoạt key này.</div>`;
    const v = await modal({
      icon: "devices", title: "Thiết bị dùng key", text: `<code>${esc(key)}</code> · ${r.devices.length}/${k.max_devices} máy`, size: "wide", body: list,
      ok: p.manageKeys ? "Lưu số máy" : "", cancel: "Đóng",
      fields: p.manageKeys ? [{ name: "max", label: "Số máy tối đa", type: "number", value: k.max_devices, min: 1, max: 100, quick: [[1, "1"], [2, "2"], [3, "3"], [5, "5"], [10, "10"]] }] : [],
      onOpen: (el, finish) => {
        el.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async () => {
          finish(null);
          if (await confirmBox("Gỡ máy này khỏi key?", "Máy đó sẽ bị đăng xuất ngay và trả lại 1 suất kích hoạt.", "Gỡ máy")) {
            await act(() => api("/admin/devices/" + b.dataset.rm, "DELETE"), "Đã gỡ máy");
          }
          showKeyDevices(key);
        }));
      },
    });
    if (v && +v.max !== k.max_devices) act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { maxDevices: +v.max }), "Đã đổi số máy tối đa");
  } catch (e) { toast(e.message, "bad"); }
}

function exportUsersCsv() {
  const head = ["ID", "Username", "TenHienThi", "VaiTro", "TrangThai", "HanDung", "KeyDangDung", "SoMay", "PhienSong", "Online", "DungHomNay_Giay", "TongThoiGian_Giay", "LuotDangNhap", "NgayTao", "DangNhapCuoi", "HoatDongCuoi", "IPCuoi", "GhiChu"];
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head.join(",")].concat(
    state.users.map((u) => [
      u.id, u.username, u.display_name, ROLE_INFO[u.role]?.label || u.role, u.disabled ? "Khoa" : "HoatDong",
      u.expires_at ? fmt(u.expires_at) : u.license_state, u.active_key || "", u.devices, u.active_sessions, u.is_online ? "Online" : "Offline",
      u.today_active_seconds || 0, u.total_active_seconds || 0, u.login_count || 0, fmt(u.created_at), fmt(u.last_login_at), fmt(u.last_active_at), u.last_ip || "", u.note || "",
    ].map(q).join(",")),
  );
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `lms-accounts-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Đã xuất file CSV danh sách tài khoản");
}

// ---- single delegated event router (zero inline onclick bugs) ----
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;
  if (a === "tab") { tab = el.dataset.tab; filter = ""; statusFilter = "all"; renderStatsAndTabs(); renderActiveTab(true); return; }
  if (a === "stat-jump") {
    tab = el.dataset.tab;
    statusFilter = el.dataset.st || "all";
    if (el.dataset.sort) sortBy = el.dataset.sort;
    filter = "";
    renderStatsAndTabs();
    renderActiveTab(true);
    return;
  }
  if (a === "jump-create-user") { tab = "users"; renderStatsAndTabs(); renderActiveTab(true); setTimeout(() => $("#uf input")?.focus(), 40); return; }
  if (a === "jump-create-key") { tab = "keys"; renderStatsAndTabs(); renderActiveTab(true); setTimeout(() => $("#kf input")?.focus(), 40); return; }
  if (a === "refresh-now") { loadAll(true); return; }
  if (a === "toggle-live") {
    autoRefresh = !autoRefresh;
    localStorage.setItem("lms.admin.live", autoRefresh ? "1" : "0");
    if ($("#livedot")) $("#livedot").className = "live-dot " + (autoRefresh ? "" : "off");
    if ($("#btn-live")) $("#btn-live").dataset.tip = autoRefresh ? "Tạm dừng tự cập nhật" : "Bật tự cập nhật 15s";
    toast(autoRefresh ? "Đã bật tự động cập nhật mỗi 15 giây" : "Đã tạm dừng tự cập nhật");
    updateClock();
    return;
  }
  if (a === "copy-text") { copy(el.dataset.val); return; }
  if (a === "copy-last-user") { copy(createdResult.lastUserText); return; }
  if (a === "copy-last-keys") { copy(createdResult.lastKeysText); return; }
  if (a === "export-users") { exportUsersCsv(); return; }
  if (a === "user-detail") { openUserDetail(el.dataset.id); return; }
  if (a === "user-edit") { editUser(el.dataset.id); return; }
  if (a === "user-keys") { tab = "keys"; filter = el.dataset.user || ""; statusFilter = "all"; renderStatsAndTabs(); renderActiveTab(true); return; }
  if (a === "give-key") { giveKey(el.dataset.user); return; }
  if (a === "assign-key") { assignKey(el.dataset.key); return; }
  if (a === "extend-key") { extendKey(el.dataset.key); return; }
  if (a === "edit-key-note") { editKeyNote(el.dataset.key); return; }
  if (a === "key-devices") { showKeyDevices(el.dataset.key); return; }
  if (a === "reset-pw") {
    const u = el.dataset.user, id = el.dataset.id;
    const v = await modal({ icon: "reset", title: "Đặt lại mật khẩu", text: `Cho tài khoản <b>${esc(u)}</b>. Mọi phiên đang đăng nhập của tài khoản này sẽ bị đăng xuất.`, ok: "Đặt lại",
      fields: [{ name: "p", label: "Mật khẩu mới", value: "", required: true, minlength: 6, placeholder: "Ít nhất 6 ký tự" }] });
    if (v) act(() => api("/admin/users/" + id, "PATCH", { password: v.p }), "Đã đặt lại mật khẩu");
    return;
  }
  if (a === "toggle-user") {
    const dis = el.dataset.dis === "1", u = el.dataset.user, id = el.dataset.id;
    if (dis && !(await confirmBox(`Khoá tài khoản ${u}?`, "Mọi phiên đang mở sẽ bị đăng xuất ngay. Có thể mở khoá lại bất kỳ lúc nào.", "Khoá tài khoản"))) return;
    act(() => api("/admin/users/" + id, "PATCH", { disabled: dis }), dis ? "Đã khoá tài khoản" : "Đã mở khoá tài khoản");
    return;
  }
  if (a === "del-user") {
    const u = el.dataset.user, id = el.dataset.id;
    if (await confirmBox(`Xoá vĩnh viễn tài khoản ${u}?`, "Không thể hoàn tác. Mọi phiên, lịch sử dùng bị xoá và key sẽ bị thu hồi.", "Xoá vĩnh viễn")) {
      act(() => api("/admin/users/" + id, "DELETE"), "Đã xoá tài khoản");
    }
    return;
  }
  if (a === "key-status") {
    const key = el.dataset.key, val = el.dataset.val;
    if (val === "revoked" && !(await confirmBox("Thu hồi key này?", `<code>${esc(key)}</code><br>Nếu tài khoản không còn key khác, app sẽ tự đăng xuất ngay.`, "Thu hồi"))) return;
    act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { status: val }), val === "active" ? "Đã khôi phục key" : "Đã thu hồi key");
    return;
  }
  if (a === "unassign-key") {
    const key = el.dataset.key;
    if (await confirmBox("Gỡ key khỏi tài khoản?", "Danh sách máy bị xoá, phiên hết key bị đăng xuất, key trở về trạng thái Chưa dùng.", "Gỡ key")) {
      act(() => api("/admin/keys/" + encodeURIComponent(key), "PATCH", { unassign: true }), "Đã gỡ key");
    }
    return;
  }
  if (a === "del-key") {
    const key = el.dataset.key;
    if (await confirmBox("Xoá vĩnh viễn key?", `<code>${esc(key)}</code><br>Không thể hoàn tác.`, "Xoá key")) {
      act(() => api("/admin/keys/" + encodeURIComponent(key), "DELETE"), "Đã xoá key");
    }
    return;
  }
  if (a === "kick-session") {
    if (await confirmBox(`Đăng xuất phiên của ${el.dataset.user}?`, "Thiết bị này sẽ phải đăng nhập lại ngay ở lần đồng bộ kế tiếp.", "Đăng xuất phiên")) {
      act(() => api("/admin/sessions/" + el.dataset.id, "DELETE"), "Đã đăng xuất phiên");
    }
    return;
  }
  if (a === "rm-device") {
    if (await confirmBox(`Gỡ thiết bị "${el.dataset.name}"?`, "Thiết bị sẽ bị đăng xuất và giải phóng 1 suất kích hoạt.", "Gỡ máy")) {
      act(() => api("/admin/devices/" + el.dataset.id, "DELETE"), "Đã gỡ thiết bị");
    }
    return;
  }
  if (a === "unlock-fail") {
    act(() => api("/admin/failures/" + encodeURIComponent(el.dataset.user), "DELETE"), "Đã mở chặn đăng nhập cho " + el.dataset.user);
    return;
  }
  if (a === "prune-logs") {
    const v = await modal({ icon: "trash", tone: "bad", title: "Dọn nhật ký hệ thống", text: "Xoá bớt nhật ký cũ để giữ cơ sở dữ liệu gọn nhẹ.", ok: "Dọn nhật ký", okTone: "danger",
      fields: [{ name: "keepDays", label: "Giữ lại nhật ký trong", value: "30", options: [["30", "30 ngày gần nhất"], ["7", "7 ngày gần nhất"], ["0", "Xoá toàn bộ nhật ký cũ"]] }] });
    if (v) act(() => api("/admin/logs?keepDays=" + encodeURIComponent(v.keepDays), "DELETE"), "Đã dọn nhật ký");
    return;
  }
  if (a === "change-pw") {
    const v = await modal({ icon: "pass", title: "Đổi mật khẩu của bạn", ok: "Đổi mật khẩu",
      fields: [
        { name: "o", label: "Mật khẩu hiện tại", type: "password", required: true },
        { name: "n", label: "Mật khẩu mới", type: "password", required: true, minlength: 6, placeholder: "Ít nhất 6 ký tự" },
        { name: "c", label: "Nhập lại mật khẩu mới", type: "password", required: true, minlength: 6 },
      ] });
    if (!v) return;
    if (v.n !== v.c) { toast("Mật khẩu xác nhận không khớp", "bad"); return; }
    act(() => api("/auth/password", "POST", { oldPassword: v.o, newPassword: v.n }), "Đã đổi mật khẩu");
    return;
  }
  if (a === "logout") {
    try { await api("/auth/logout", "POST"); } catch {}
    clearSession("");
    return;
  }
});

// ---- live clock & polling ----
function updateClock() {
  const clk = $("#liveclock");
  if (clk) clk.textContent = new Date(serverNow()).toLocaleTimeString("vi-VN", { hour12: false });
  const lt = $("#livetext");
  if (lt) {
    if (refreshing) lt.textContent = "Đang đồng bộ…";
    else if (!state.lastSyncAt) lt.textContent = "Chưa đồng bộ";
    else {
      const sec = Math.max(0, Math.floor((Date.now() - state.lastSyncAt) / 1000));
      lt.textContent = autoRefresh ? `Trực tiếp · ${sec < 3 ? "vừa cập nhật" : sec + "s trước"}` : `Tạm dừng · ${sec}s trước`;
    }
  }
}

function startTimers() {
  stopTimers();
  clockTimer = setInterval(updateClock, 1000);
  pollTimer = setInterval(() => {
    if (autoRefresh && token && document.visibilityState === "visible" && !dlg.open) {
      loadAll(false);
    }
  }, POLL_MS);
}

function stopTimers() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && token && autoRefresh && Date.now() - state.lastSyncAt > 5000) {
    loadAll(false);
  }
});

async function loadAll(showSpinner = false) {
  if (!token || refreshing) return;
  refreshing = true;
  const rBtn = $("#btn-refresh");
  if (rBtn && showSpinner) rBtn.querySelector("svg")?.classList.add("spin");
  updateClock();
  try {
    const snap = await api("/admin/snapshot?limit=200");
    if (!isConsoleRole(snap.me?.role)) {
      clearSession("Tài khoản đã bị thay đổi phân quyền và không còn quyền quản trị.");
      return;
    }
    me = snap.me;
    localStorage.setItem("lms.admin.me", JSON.stringify(me));
    const srvNow = snap.serverTime || snap.stats?.serverTime || Date.now();
    state = {
      loaded: true,
      now: srvNow,
      clockOffset: srvNow - Date.now(),
      lastSyncAt: Date.now(),
      stats: snap.stats || {},
      users: snap.users || [],
      keys: snap.keys || [],
      sessions: snap.sessions || [],
      devices: snap.devices || [],
      logs: snap.logs || [],
      failures: snap.failures || [],
      roles: snap.roles || null,
    };
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch {}
    if (!shellMounted) mountShell();
    else {
      renderStatsAndTabs();
      renderActiveTab(false);
    }
  } catch (e) {
    if (token && showSpinner) toast(e.message || "Không thể đồng bộ dữ liệu", "bad");
  } finally {
    refreshing = false;
    if (rBtn) rBtn.querySelector("svg")?.classList.remove("spin");
    updateClock();
  }
}

// ---- boot ----
(async function boot() {
  if (!token) {
    renderLogin($("#app"));
    return;
  }
  if (me && state.loaded) {
    mountShell();
    startTimers();
    loadAll(false);
  } else {
    $("#app").innerHTML = `<div class="boot"><div class="logo-glow" style="margin:0"><img src="/logo-lms.png" alt=""></div><div>Đang xác thực phiên quản trị…</div></div>`;
    await loadAll(true);
    if (token) startTimers();
  }
})();
</script>
