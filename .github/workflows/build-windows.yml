name: Build Windows

# Every push to main builds the installer and publishes it as a GitHub Release
# (version <major>.<minor>.<run number>). Installed apps check the latest
# release, download it in the background and ask to restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Releases must be published one at a time so version numbers stay in order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version from the run number
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "$base.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          node -p "'Building version ' + require('./package.json').version"

      - name: Build app
        run: npm run build

      - name: Build installer and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: LMS-Windows
          path: dist/LMS-*-win.exe
          retention-days: 14
