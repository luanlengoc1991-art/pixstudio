name: Build Windows

# Every push to main builds the installer and publishes it as a GitHub Release
# (version <major>.<minor>.<run number>). Installed apps check the latest
# release, download it in the background and ask to restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Releases must be published one at a time so version numbers stay in order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set version from the run number
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "$base.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          node -p "'Building version ' + require('./package.json').version"

      - name: Build app
        run: npm run build

      # electron-builder only builds (it still writes latest.yml for the updater);
      # publishing it itself raced two uploads and left a release without latest.yml
      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment so quotes in commit messages cannot break the command
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          version=$(node -p "require('./package.json').version")
          ls dist/LMS-$version-win.exe dist/LMS-$version-win.exe.blockmap dist/latest.yml
          gh release create "v$version" \
            "dist/LMS-$version-win.exe" "dist/LMS-$version-win.exe.blockmap" dist/latest.yml \
            --title "$version" --notes "$NOTES" --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: LMS-Windows
          path: dist/LMS-*-win.exe
          retention-days: 14
